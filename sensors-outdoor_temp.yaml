# Outdoor temperature sensor configuration

# Digital outdoor temperature sensor bus configuration
#one_wire:
#  - platform: gpio
#    id: outdoor_temperature_bus
#    pin: $digital_temp_pin

# Broadcast providers
substitutions:
  temperature_provider_node_name: et

# Packet transport configuration
udp:

# Broadcast provider configuration
packet_transport:
  - platform: udp
    id: transport_input
    providers:
      - name: $temperature_provider_node_name
        encryption: !secret broadcast_key

# Sensor configurations
sensor:
  # Active outdoor temperature sensor (automatic fail-over with backup value)
  - platform: template
    name: Utetemperatur
    id: outdoor_temperature
    icon: mdi:thermometer
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 20s
    lambda: |-
      if ( id(${node_name}_connection_status).state ) {
        if ( !isnan(id(outdoor_temperature_remote).state) )
          return id(outdoor_temperature_remote).state;
        if ( !isnan(id(outdoor_temperature_broadcast).state) )
          return id(outdoor_temperature_broadcast).state;
      }
      if ( !isnan(id(outdoor_temperature_analog).state) )
        return id(outdoor_temperature_analog).state;
      //if ( !isnan(id(outdoor_temperature_digital).state) )
      //  return id(outdoor_temperature_digital).state;
      return 8.0;

  # Remote outdoor temperature sensor (Home Assistant)
  - platform: homeassistant
    id: outdoor_temperature_remote
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    entity_id: sensor.utetemperatur
    filters:
      - heartbeat: 20s

  # Remote outdoor temperature sensor (Broadcast)
  - platform: packet_transport
    id: outdoor_temperature_broadcast
    transport_id: transport_input
    provider: $temperature_provider_node_name
    remote_id: outdoor_temperature
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2

#  # Digital outdoor temperature sensor (DS18B20)
#  - platform: dallas_temp
#    name: Utetemperatur digital givare
#    id: outdoor_temperature_digital_sensor
#    accuracy_decimals: 2
#    update_interval: 20s
#    one_wire_id: outdoor_temperature_bus
##    address: 0x2c0000081d200d28
#    resolution: 12
#    filters:
#      - heartbeat: 20s
#
#  # Digital outdoor temperature
#  - platform: exponential_moving_average
#    name: Utetemperatur digital
#    id: outdoor_temperature_digital
#    sensor: outdoor_temperature_digital_sensor
#    time_constant: 6min
#    time_weighting: new

  # Analog outdoor temperature voltage measurement
  - platform: adc
    name: Utetemperatur analog mätning
    id: outdoor_temperature_analog_measure
    accuracy_decimals: 3
    pin: $analog_temp_pin
    icon: mdi:current-dc
    update_interval: never
    attenuation: 12dB
    samples: 80

  # Analog outdoor temperature voltage measurement average
  - platform: exponential_moving_average
    name: Utetemperatur analog mätning medel
    id: outdoor_temperature_analog_measure_average
    sensor: outdoor_temperature_analog_measure
    time_constant: 6min
    time_weighting: new

  # Analog outdoor temperature resistance calculation
  - platform: resistance
    name: Utetemperatur analog resistans
    id: outdoor_temperature_analog_resistance
    icon: mdi:omega
    sensor: outdoor_temperature_analog_measure_average
    configuration: DOWNSTREAM
    resistor: 10kOhm

  # Analog outdoor temperature sensor (NTC)
  - platform: ntc
    name: Utetemperatur analog givare
    id: outdoor_temperature_analog_sensor
    accuracy_decimals: 2
    sensor: outdoor_temperature_analog_resistance
    # NTC Beta factor calibration
#    calibration:
#      b_constant: 3919
#      reference_temperature: 5°C
#      reference_resistance: 5.66kOhm
    # NTC calibration points for UVEAB EVR-U according to documentation.
    calibration:
    # - 43.03kOhm -> -30°C
    # - 31.09kOhm -> -25°C
    # - 22.76kOhm -> -20°C
    # - 16.86kOhm -> -15°C
      - 12.63kOhm -> -10°C
    # - 9.57kOhm -> -5°C
    # - 7.32kOhm -> 0°C
      - 5.66kOhm -> 5°C
    # - 4.41kOhm -> 10°C
    # - 3.47kOhm -> 15°C
      - 2.75kOhm -> 20°C
    # - 2.20kOhm -> 25°C
    filters:
      - lambda: return x + id(outdoor_temperature_analog_offset).state;
#      - offset: 0.4

  # Analog outdoor temperature
  - platform: exponential_moving_average
    name: Utetemperatur analog
    id: outdoor_temperature_analog
    sensor: outdoor_temperature_analog_sensor
    time_constant: 6min
    time_weighting: new

# Analog outdoor temperature offset
number:
  - platform: template
    name: Utetemperatur analog kompensering
    id: outdoor_temperature_analog_offset
    unit_of_measurement: °C
    initial_value: 0.0
    restore_value: true
    optimistic: true
    min_value: -10.0
    max_value: 10.0
    step: 0.1
    mode: box

# Analog temperature sensor power source configuration
switch:
  - platform: gpio
    pin: $analog_power_pin
    id: outdoor_analog_sensor_power

# Analog temperature sensor update interval
interval:
  - interval: 20s
    then:
      - switch.turn_on: outdoor_analog_sensor_power
      - delay: 1s
      - component.update: outdoor_temperature_analog_measure
      - delay: 1s
      - switch.turn_off: outdoor_analog_sensor_power
